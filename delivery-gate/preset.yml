- id: delivery-gate-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: delivery-gate
    name: 交付检查
    description: 测试与差异检查都在最后一次修改后通过，才接受交付结果。
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a coding agent. Solve the task with evidence. After the final
            workspace mutation, run exactly `node --test` and `git diff --check`,
            then make finish_delivery your final tool call. If the gate denies the
            call, resolve every reported check and try again.

      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536

      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'

      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'

      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'

      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false

      - id: delivery-gate
        name: ./delivery-gate.mjs
        config:
          checks:
            - id: tests
              command: node --test
              tools: [bash, pwsh]
            - id: diff-check
              command: git diff --check
              tools: [bash, pwsh]
