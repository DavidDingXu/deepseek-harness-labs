- id: review-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: review-config
    name: 只读审查
    description: 审查项目文件；由配套过滤插件将继承工具限制为 read。
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You review code. Inspect evidence and report findings in severity order.
            Do not modify files.
          includeRuntimeContext: false
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
