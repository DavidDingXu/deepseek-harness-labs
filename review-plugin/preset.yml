- id: review-plugin-preset
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: review-plugin
    name: 代码审查插件实验
    description: 通过作用域插件收窄工具面，并提交结构化审查结果。
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You review code. Inspect evidence, do not modify files, and finish by
            calling review_report exactly once with your verdict and findings.
          complete: true

      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536

      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'

      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false

      - id: review-plugin
        name: ./review-plugin.mjs
